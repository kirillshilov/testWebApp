<!DOCTYPE html>
<html>
<head>
  <title>Telegram WebApp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<h1>Привет, <span id="username"></span>!</h1>

<div id="response" style="margin-top: 20px;"></div>

<script>
  const tg = window.Telegram.WebApp;
  const user = tg.initDataUnsafe.user;

  document.getElementById("username").textContent = user?.username || "гость";

  fetch("http://localhost:8080/auth", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      initData: tg.initData,
      hash: tg.initData.split("&").find(x => x.startsWith("hash="))?.split("=")[1]
    })
  })
          .then(async response => {
            if (response.status === 401) {
              throw new Error("Ошибка авторизации");
            }
            if (!response.ok) {
              const errorData = await response.json().catch(() => ({}));
              throw new Error(errorData.error || "Ошибка сервера");
            }
            return response.json();
          })
          .then(data => {
            const cardHTML = `
      <div style="
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 15px;
        background-color: #f9f9f9;
        max-width: 300px;
        font-family: sans-serif;
      ">
        <div><strong>ID:</strong> ${data.id}</div>
        <div><strong>Имя:</strong> ${data.first_name}</div>
        <div><strong>Фамилия:</strong> ${data.last_name}</div>
        <div><strong>Username:</strong> @${data.username}</div>
      </div>
    `;
            document.getElementById("response").innerHTML = cardHTML;
          })
          .catch(error => {
            document.getElementById("response").textContent = "Ошибка при получении данных: " + error.message;
          });
</script>
</body>
</html>
