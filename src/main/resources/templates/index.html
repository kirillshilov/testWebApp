<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Telegram WebApp</title>
    <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-2xl shadow-md">
    <h1 class="text-2xl font-bold mb-4">
        Привет, <span th:text="${user.username != null} ? ${user.username} : 'гость'">гость</span>!
    </h1>

    <div class="space-y-2">
        <div><strong>ID:</strong> <span th:text="${user.id}">-</span></div>
        <div><strong>Имя:</strong> <span th:text="${user.firstName}">-</span></div>
        <div><strong>Фамилия:</strong> <span th:text="${user.lastName}">-</span></div>
        <div><strong>Username:</strong> <span th:text="'@' + ${user.username}">-</span></div>
    </div>
</div>
</body>
</html>
